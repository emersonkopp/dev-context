[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kiro-ai-router"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
